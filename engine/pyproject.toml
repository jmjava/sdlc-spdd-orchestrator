[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sdlc-engine"
version = "2.0.0a6"
description = "Python orchestration engine for SDLC-SPDD (v2)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SDLC-SPDD contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]
viewer = ["flask>=3"]
viewer-e2e = ["flask>=3", "pytest-playwright>=0.5.0"]

[project.scripts]
sdlc-engine = "sdlc_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "github_integration: live GitHub Issues tests via gh (network + auth)",
  "viewer_integration: live Jira sync via viewer (skipped unless env set)",
  "viewer_e2e: Playwright GUI tests for the ADF viewer (needs chromium)",
  "console_e2e: Playwright GUI tests for the ops console (needs chromium)",
  "guide_live: Vue3 console against live Guide+Neo4j dual-repo stack",
  "adf_viewer_live: Vue3 ADF tab against a real viewer process (not stubbed)",
]
