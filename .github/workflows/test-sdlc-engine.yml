name: Test SDLC Engine (Python v2)

on:
  pull_request:
    paths:
      - 'engine/**'
      - 'adf/**'
      - 'console-ui/**'
      - 'templates/adf/**'
      - 'scripts/sdlc.sh'
      - 'scripts/run-test-suites.sh'
      - '.github/workflows/test-sdlc-engine.yml'
  push:
    branches: [main]
    paths:
      - 'engine/**'
      - 'adf/**'
      - 'console-ui/**'
      - 'templates/adf/**'
      - 'scripts/sdlc.sh'
      - 'scripts/run-test-suites.sh'
      - '.github/workflows/test-sdlc-engine.yml'

jobs:
  suite-1-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install engine
        run: python3 -m pip install -e './engine[dev,viewer]'
      - name: Suite 1 — unit
        run: PYTHONPATH=engine/src pytest -q engine/tests_unit

  suite-2-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install engine + viewer
        run: python3 -m pip install -e './engine[dev,viewer]'
      - name: Suite 2 — local integration
        run: PYTHONPATH=engine/src pytest -q engine/tests_integration
      - name: Installer coverage (≥90%)
        run: >
          PYTHONPATH=engine/src pytest -q
          engine/tests_integration
          engine/tests_unit/test_installer_runtime_units.py
          engine/tests_unit/test_installer_templates_api.py
          engine/tests_unit/test_vue3_console_serve.py
          --cov=sdlc_engine.installer
          --cov-report=term-missing:skip-covered
          --cov-fail-under=90
      - name: CLI smoke via sdlc.sh
        run: |
          SDLC_ENGINE=python ./scripts/sdlc.sh version
          SDLC_ENGINE=python ./scripts/sdlc.sh next
          SDLC_ENGINE=python ./scripts/sdlc.sh viewer --help
      - name: Shim regression harness
        run: ./tests/test-sdlc-engine-shim.sh

  test-github-issue-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install engine
        run: python3 -m pip install -e './engine[dev]'
      - name: GitHub Issues (suite 3 subset)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SDLC_GITHUB_INTEGRATION: "1"
          SDLC_GITHUB_ISSUE_CREATE: "1"
          SDLC_GITHUB_REPO: ${{ github.repository }}
        run: PYTHONPATH=engine/src pytest -q engine/tests_e2e/test_issues_github_integration.py
