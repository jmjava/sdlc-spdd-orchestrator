name: Test SDLC Engine (Python v2)

on:
  pull_request:
    paths:
      - 'engine/**'
      - 'adf/**'
      - 'console-ui/**'
      - 'templates/adf/**'
      - 'scripts/sdlc.sh'
      - '.github/workflows/test-sdlc-engine.yml'
  push:
    branches: [main]
    paths:
      - 'engine/**'
      - 'adf/**'
      - 'console-ui/**'
      - 'templates/adf/**'
      - 'scripts/sdlc.sh'
      - '.github/workflows/test-sdlc-engine.yml'

jobs:
  test-sdlc-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install engine + pytest + viewer
        run: python3 -m pip install -e './engine[dev,viewer]'

      - name: Run pytest (unit + mocked issue sync + viewer)
        run: pytest -q engine/tests

      - name: Installer package coverage (≥90%)
        run: >
          PYTHONPATH=engine/src pytest -q engine/tests/test_installer*.py
          --cov=sdlc_engine.installer
          --cov-report=term-missing:skip-covered
          --cov-fail-under=90

      - name: Install Playwright e2e extras + Chromium
        run: |
          python3 -m pip install -e './engine[dev,viewer-e2e]'
          python3 -m playwright install --with-deps chromium

      - name: Run ADF viewer Playwright GUI tests
        env:
          SDLC_VIEWER_E2E: "1"
        run: pytest -q engine/tests/test_viewer_playwright.py -m viewer_e2e

      - name: Run ops console Playwright GUI tests (Flask HTML)
        env:
          SDLC_CONSOLE_E2E: "1"
        run: pytest -q engine/tests/test_console_playwright.py -m console_e2e

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: console-ui/package-lock.json

      - name: Build Vue3 ops console
        working-directory: console-ui
        run: |
          npm ci
          npm run build

      - name: Run Vue3 ops console Playwright GUI tests
        env:
          SDLC_CONSOLE_E2E: "1"
        run: pytest -q engine/tests/test_vue3_console_playwright.py -m console_e2e

      - name: CLI smoke via sdlc.sh python engine
        run: |
          SDLC_ENGINE=python ./scripts/sdlc.sh version
          SDLC_ENGINE=python ./scripts/sdlc.sh next
          SDLC_ENGINE=python ./scripts/sdlc.sh viewer --help

      - name: Shim regression harness
        run: ./tests/test-sdlc-engine-shim.sh

  # Live GitHub Issues sync: pull always; create+close when permissions allow.
  test-github-issue-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install engine + pytest
        run: python3 -m pip install -e './engine[dev]'

      - name: GitHub Issues integration (pull + create round-trip)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SDLC_GITHUB_INTEGRATION: "1"
          SDLC_GITHUB_ISSUE_CREATE: "1"
          SDLC_GITHUB_REPO: ${{ github.repository }}
        run: |
          pytest -q engine/tests/test_issues_github_integration.py \
            --run-github-integration -m github_integration
