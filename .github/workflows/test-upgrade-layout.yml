name: Test Upgrade Layout

on:
  pull_request:
    paths:
      - 'scripts/upgrade-project.sh'
      - 'scripts/init-project.sh'
      - 'scripts/setup-agent-prompts.sh'
      - 'scripts/verify-project-install.sh'
      - 'scripts/lib/framework-install.sh'
      - 'scripts/lib/skills.sh'
      - 'templates/**'
      - 'tests/test-upgrade-layout.sh'
      - '.github/workflows/test-upgrade-layout.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/upgrade-project.sh'
      - 'scripts/init-project.sh'
      - 'scripts/setup-agent-prompts.sh'
      - 'scripts/verify-project-install.sh'
      - 'scripts/lib/framework-install.sh'
      - 'scripts/lib/skills.sh'
      - 'templates/**'
      - 'tests/test-upgrade-layout.sh'
      - '.github/workflows/test-upgrade-layout.yml'

jobs:
  test-upgrade-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install engine
        run: python -m pip install -q -e ./engine

      - name: Check shell syntax
        run: |
          bash -n scripts/upgrade-project.sh
          bash -n scripts/verify-project-install.sh
          bash -n scripts/lib/framework-install.sh
          bash -n tests/test-upgrade-layout.sh

      - name: Integration — upgrade layout contract (v3 only)
        run: ./tests/test-upgrade-layout.sh
