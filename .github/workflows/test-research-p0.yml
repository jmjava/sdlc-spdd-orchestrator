name: Test Research P0 Artifacts

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-research-p0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Syntax-check checker and tests
        run: python3 -m py_compile sdlc-spdd/docs/research/check_p0_artifacts.py sdlc-spdd/docs/research/check_dogfood_ledger.py tests/research/test_p0_artifacts.py tests/research/test_test002_slice.py tests/research/test_chore003_ledger.py tests/research/test_ref001_sut.py tests/eval/test-002-hello/score_slice.py

      - name: Run structured research artifact tests
        run: python3 -m unittest tests.research.test_p0_artifacts -v

      - name: prove-p0.sh DOC-001 (delegates to structured checker)
        run: ./sdlc-spdd/docs/research/prove-p0.sh DOC-001

      - name: prove-p0.sh DOC-002 (delegates to structured checker)
        run: ./sdlc-spdd/docs/research/prove-p0.sh DOC-002

      - name: prove-p0.sh TEST-001 (delegates to structured checker)
        run: ./sdlc-spdd/docs/research/prove-p0.sh TEST-001

      - name: prove-p0.sh DOC-003 (delegates to structured checker)
        run: ./sdlc-spdd/docs/research/prove-p0.sh DOC-003

      - name: TEST-002 first-slice artifacts
        run: python3 -m unittest tests.research.test_test002_slice -v

      - name: CHORE-003 dogfood ledger
        run: python3 -m unittest tests.research.test_chore003_ledger -v

      - name: REF-001 engine SUT
        run: PYTHONPATH=engine/src python3 -m unittest tests.research.test_ref001_sut -v
