name: Validate SDLC-SPDD Command Adapters

on:
  pull_request:
    paths:
      - '.cursor/commands/sdlc-*.md'
      - '.cursor/rules/sdlc-spdd.mdc'
      - '.github/prompts/sdlc-*.prompt.md'
      - '.github/copilot-instructions.md'
      - '.claude/commands/sdlc-*.md'
      - 'CLAUDE.md'
      - 'scripts/validate-command-adapters.sh'
      - 'sdlc-spdd/scripts/validate-command-adapters.sh'
      - '.github/workflows/validate-sdlc-spdd-adapters.yml'
  push:
    branches: [main]
    paths:
      - '.cursor/commands/sdlc-*.md'
      - '.cursor/rules/sdlc-spdd.mdc'
      - '.github/prompts/sdlc-*.prompt.md'
      - '.github/copilot-instructions.md'
      - '.claude/commands/sdlc-*.md'
      - 'CLAUDE.md'
      - 'scripts/validate-command-adapters.sh'
      - 'sdlc-spdd/scripts/validate-command-adapters.sh'
      - '.github/workflows/validate-sdlc-spdd-adapters.yml'

jobs:
  validate-command-adapters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check validator shell syntax
        run: bash -n sdlc-spdd/scripts/validate-command-adapters.sh

      - name: Validate installed dogfood packs (not templates/)
        run: |
          set -euo pipefail
          scratch="$(mktemp -d)"
          mkdir -p "${scratch}/.cursor/commands" "${scratch}/.cursor/rules"
          cp .cursor/commands/sdlc-*.md "${scratch}/.cursor/commands/"
          cp .cursor/rules/sdlc-spdd.mdc "${scratch}/.cursor/rules/"
          # Copilot/Claude dogfood I1/I2 parity is leftover #5; Cursor is the
          # proving host. --mode installed so a templates/ copy cannot hide drift.
          bash sdlc-spdd/scripts/validate-command-adapters.sh --target "${scratch}" --mode installed
