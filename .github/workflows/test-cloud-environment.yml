name: Test Cloud Environment

on:
  pull_request:
    paths:
      - '.cursor/environment.json'
      - '.cursor/install.sh'
      - 'docs/research/uberorchbot-via-sdlc-spdd.md'
      - 'docs/maintaining-your-project.md'
      - 'sdlc-spdd/docs/maintaining-your-project.md'
      - 'tests/test-cloud-environment.sh'
      - 'tests/test-install-noninteractive-path.sh'
      - 'tests/test-install-sh-runs.sh'
      - 'tests/test-agent-can-update-snapshot-semantics.sh'
      - 'tests/test-u2-does-not-pin-doc-prose.sh'
      - 'tests/lib/agent_can_update_snapshot.py'
      - '.github/workflows/test-cloud-environment.yml'
  push:
    branches: [main]
    paths:
      - '.cursor/environment.json'
      - '.cursor/install.sh'
      - 'docs/research/uberorchbot-via-sdlc-spdd.md'
      - 'docs/maintaining-your-project.md'
      - 'sdlc-spdd/docs/maintaining-your-project.md'
      - 'tests/test-cloud-environment.sh'
      - 'tests/test-install-noninteractive-path.sh'
      - 'tests/test-install-sh-runs.sh'
      - 'tests/test-agent-can-update-snapshot-semantics.sh'
      - 'tests/test-u2-does-not-pin-doc-prose.sh'
      - 'tests/lib/agent_can_update_snapshot.py'
      - '.github/workflows/test-cloud-environment.yml'

jobs:
  test-cloud-environment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check shell syntax
        run: bash -n .cursor/install.sh tests/test-cloud-environment.sh tests/test-install-noninteractive-path.sh tests/test-install-sh-runs.sh tests/test-agent-can-update-snapshot-semantics.sh tests/test-u2-does-not-pin-doc-prose.sh

      - name: Lock U2 environment.json contract
        run: ./tests/test-cloud-environment.sh

      - name: Leftover #10 non-interactive PATH
        run: ./tests/test-install-noninteractive-path.sh

      - name: Leftover #11 install.sh runs
        run: ./tests/test-install-sh-runs.sh

      - name: Leftover #12 snapshot-flag schema meaning
        run: ./tests/test-agent-can-update-snapshot-semantics.sh

      - name: Leftover #13 U2 does not pin doc prose
        run: ./tests/test-u2-does-not-pin-doc-prose.sh
