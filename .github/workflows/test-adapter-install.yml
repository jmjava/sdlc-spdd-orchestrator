name: Test Adapter Install

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'templates/cursor/**'
      - 'templates/copilot/**'
      - 'templates/claude/**'
      - 'templates/agent-context/hooks/**'
      - 'templates/project-github-workflows/validate-sdlc-spdd-adapters.yml'
      - 'tests/test-adapter-install.sh'
      - 'tests/test-i3-hook-write-is-behavioral.sh'
      - 'tests/test-identical-branch-hint.sh'
      - 'spec/commands/**'
      - '.cursor/commands/sdlc-*.md'
      - '.claude/commands/sdlc-*.md'
      - '.github/prompts/sdlc-*.prompt.md'
      - '.github/workflows/test-adapter-install.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'templates/cursor/**'
      - 'templates/copilot/**'
      - 'templates/claude/**'
      - 'templates/agent-context/hooks/**'
      - 'templates/project-github-workflows/validate-sdlc-spdd-adapters.yml'
      - 'tests/test-adapter-install.sh'
      - 'tests/test-i3-hook-write-is-behavioral.sh'
      - 'tests/test-identical-branch-hint.sh'
      - 'spec/commands/**'
      - '.cursor/commands/sdlc-*.md'
      - '.claude/commands/sdlc-*.md'
      - '.github/prompts/sdlc-*.prompt.md'
      - '.github/workflows/test-adapter-install.yml'

jobs:
  test-adapter-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check shell syntax
        run: bash -n scripts/*.sh tests/test-adapter-install.sh tests/test-i3-hook-write-is-behavioral.sh tests/test-identical-branch-hint.sh templates/agent-context/hooks/pre-commit.sample

      - name: Run adapter install/upgrade/validation regression tests
        run: ./tests/test-adapter-install.sh

      - name: Leftover #18 I3 hook-write is behavioral
        run: ./tests/test-i3-hook-write-is-behavioral.sh

      - name: Leftover #19 install rewrite keeps path branches distinct
        run: ./tests/test-identical-branch-hint.sh
