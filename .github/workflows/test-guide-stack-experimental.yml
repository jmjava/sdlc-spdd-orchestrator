name: Test Guide Stack (Experimental)

# EXPERIMENTAL — full Guide + Neo4j live stack. Not required for consumer installs.
# Runs on workflow_dispatch and when ops-console / guide-test paths change on PRs.
# Live Guide+Neo4j (and Vue guide_live) skip with a warning when repo.embabel.com
# is unreachable; Gradle wrapper prefetch and ADF viewer live still run.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'engine/src/sdlc_engine/installer/**'
      - 'engine/tests_integration/**'
      - 'engine/tests_e2e/**'
      - 'console-ui/**'
      - 'tests/test-guide-stack-live.sh'
      - '.github/workflows/test-guide-stack-experimental.yml'
  push:
    branches: [main]
    paths:
      - 'engine/src/sdlc_engine/installer/**'
      - 'engine/tests_e2e/test_vue3_console_live_playwright.py'
      - 'console-ui/**'
      - 'tests/test-guide-stack-live.sh'
      - '.github/workflows/test-guide-stack-experimental.yml'

concurrency:
  group: guide-stack-${{ github.ref }}
  # Guide cold boot can take 15–30+ min; do not cancel when a follow-up push lands.
  cancel-in-progress: false

jobs:
  installer-unit:
    name: Experimental console unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install engine + Flask
        run: python3 -m pip install -e './engine[dev,viewer]'
      - name: Suite 2 — installer API + coverage
        run: >
          PYTHONPATH=engine/src python3 -m pytest -q
          engine/tests_integration
          engine/tests_unit/test_installer_runtime_units.py
          engine/tests_unit/test_installer_templates_api.py
          engine/tests_unit/test_vue3_console_serve.py
          --cov=sdlc_engine.installer
          --cov-report=term-missing:skip-covered
          --cov-fail-under=90

  guide-neo4j-live:
    name: Experimental Guide + Neo4j live stack
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout orchestrator
        uses: actions/checkout@v4
        with:
          path: sdlc-spdd-orchestrator

      # Private sibling repo: set repo secret GUIDE_CHECKOUT_TOKEN (classic PAT or
      # fine-grained read on jmjava/orch-guide). Falls back to GITHUB_TOKEN (works only if
      # orch-guide is public or same-repo access is granted).
      - name: Checkout jmjava/orch-guide (SPDD durable home)
        uses: actions/checkout@v4
        with:
          repository: jmjava/orch-guide
          ref: sdlc-spdd-projection-v2
          path: guide
          token: ${{ secrets.GUIDE_CHECKOUT_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: guide/pom.xml

      - name: Install orchestrator engine
        working-directory: sdlc-spdd-orchestrator
        run: python3 -m pip install -e './engine[dev,viewer]'

      # orch-guide codegen-gradle wrapper ships networkTimeout=10000ms. Cold
      # runners cannot fetch gradle-9.6.1-bin.zip in 10s. Prefetch the wrapper
      # only — kspKotlin also needs repo.embabel.com (gated below).
      - name: Prefetch codegen-gradle wrapper
        working-directory: guide/codegen-gradle
        run: |
          if [[ -f gradle/wrapper/gradle-wrapper.properties ]]; then
            sed -i 's/networkTimeout=[0-9][0-9]*/networkTimeout=180000/' \
              gradle/wrapper/gradle-wrapper.properties
          fi
          ./gradlew --no-daemon --version

      - name: Preflight Embabel snapshot repo
        id: embabel
        working-directory: sdlc-spdd-orchestrator
        run: |
          # shellcheck source=scripts/lib/test-preflight.sh
          source scripts/lib/test-preflight.sh
          if test_preflight_embabel_snapshot_repo; then
            echo "reachable=true" >> "${GITHUB_OUTPUT}"
            echo "Embabel snapshot repo reachable — live Guide+Neo4j will run"
          else
            echo "reachable=false" >> "${GITHUB_OUTPUT}"
            echo "::warning::repo.embabel.com unreachable from this runner; skipping live Guide+Neo4j (experimental). ADF viewer live still runs."
          fi

      - name: Prefetch Guide Maven deps
        if: steps.embabel.outputs.reachable == 'true'
        working-directory: guide
        run: ./mvnw -q -DskipTests dependency:go-offline || ./mvnw -q -DskipTests -DskipITs validate

      - name: Prefetch codegen-gradle KSP
        if: steps.embabel.outputs.reachable == 'true'
        working-directory: guide/codegen-gradle
        run: ./gradlew --no-daemon kspKotlin

      - name: Live Guide + Neo4j stack test (API)
        if: steps.embabel.outputs.reachable == 'true'
        working-directory: sdlc-spdd-orchestrator
        env:
          CI: 'true'
          SDLC_GUIDE_STACK_LIVE: '1'
          GUIDE_HOME: ${{ github.workspace }}/guide
          GUIDE_GIT_REF: sdlc-spdd-projection-v2
          GUIDE_PORT: '21337'
          NEO4J_BOLT_PORT: '7687'
          NEO4J_HTTP_PORT: '7474'
          GUIDE_START_TIMEOUT_SEC: '900'
          GUIDE_KEEP: '1'
          # Placeholder so Spring Anthropic autoconfigure does not block boot.
          ANTHROPIC_API_KEY: dummy-key
        run: |
          chmod +x tests/test-guide-stack-live.sh
          ./tests/test-guide-stack-live.sh

      - name: Teardown Guide + Neo4j
        if: always() && steps.embabel.outputs.reachable == 'true'
        working-directory: sdlc-spdd-orchestrator
        env:
          GUIDE_STOP_NEO4J: '1'
        run: |
          python3 <<'PY'
          from pathlib import Path
          from sdlc_engine.installer.app import create_app
          root = Path(".")
          c = create_app(root).test_client()
          print("stop guide", c.post("/api/guide/stop", json={"target": str(root.resolve())}).get_json())
          print("stop neo4j", c.post("/api/guide/neo4j/stop", json={"target": str(root.resolve())}).get_json())
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sdlc-spdd-orchestrator/console-ui/package-lock.json

      - name: Build Vue3 console + install Playwright
        working-directory: sdlc-spdd-orchestrator
        run: |
          python3 -m pip install -e './engine[dev,viewer-e2e]'
          python3 -m playwright install --with-deps chromium
          cd console-ui && npm ci && npm run build

      - name: Vue3 Playwright live Guide stack
        if: steps.embabel.outputs.reachable == 'true'
        working-directory: sdlc-spdd-orchestrator
        env:
          CI: 'true'
          SDLC_GUIDE_STACK_LIVE: '1'
          GUIDE_HOME: ${{ github.workspace }}/guide
          GUIDE_GIT_REF: sdlc-spdd-projection-v2
          GUIDE_PORT: '21337'
          NEO4J_BOLT_PORT: '7687'
          NEO4J_HTTP_PORT: '7474'
          GUIDE_START_TIMEOUT_SEC: '900'
          ANTHROPIC_API_KEY: dummy-key
        run: >
          PYTHONPATH=engine/src pytest -q engine/tests_e2e/test_vue3_console_live_playwright.py
          -m guide_live --run-guide-live

      - name: Vue3 Playwright live ADF viewer
        working-directory: sdlc-spdd-orchestrator
        env:
          CI: 'true'
          SDLC_ADF_VIEWER_LIVE: '1'
          ADF_VIEWER_PORT: '5050'
        run: >
          PYTHONPATH=engine/src pytest -q engine/tests_e2e/test_vue3_console_live_playwright.py
          -m adf_viewer_live --run-adf-viewer-live

      - name: Upload Guide log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: guide-stack-logs
          path: |
            /tmp/sdlc-guide-*.log
            /tmp/sdlc-adf-viewer-*.log
          if-no-files-found: ignore
