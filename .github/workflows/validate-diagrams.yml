name: Validate PlantUML Diagrams

on:
  pull_request:
    paths:
      - 'docs/diagrams/**'
      - 'scripts/render-diagrams.sh'
  push:
    branches: [main]
    paths:
      - 'docs/diagrams/**'
      - 'scripts/render-diagrams.sh'

jobs:
  validate-diagrams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Validate PlantUML diagrams
        run: ./scripts/render-diagrams.sh --check
